    channels: []
    payout: {type: cpm, per_1k_views: 1.50, budget: 5000, platforms: [tiktok, instagram]}
    clip: {min_s: 15, max_s: 60}
    required: {disclosure: "#ad"}
    brief: ""
    reframe: {mode: auto}

  # Added 2026-11-26 at Aaron's request. NOT joined: licensed stays false until Aaron is in
