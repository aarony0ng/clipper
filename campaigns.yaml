             platforms: [tiktok, instagram_reels, youtube_shorts]}
    clip: {min_s: 15, max_s: 60}
    required:
      hashtags: ["#streamhouselacwe", "#streamhousela", "#cwetv", "#chickenwrapentertainment"]
      disclosure: "#ad"
    mentions: ["@streamhousela"]
