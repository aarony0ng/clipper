# Rules the revenue strategist follows. Explained in docs/REVENUE_PLAN.md.
# Thresholds are starting points; recalibrate from work/revenue/ledger.csv after 30 posts.

scoring:
  criteria: [hook, payoff, energy, context_free, visual, fit]   # each 0-10 (tastemaker method)

tiers:
  A: {min_avg: 7.0, min_each: 6, min_hook: 7, min_visual: 8, action: post_all_platforms}
  B: {min_avg: 6.0, min_hook: 6, min_visual: 8, action: test_one_platform}
  C: {action: archive}

tests:
  max_per_week: 1
  platforms: 1
  never_back_to_back: true

cadence:
  max_posts_per_platform_per_day: 2
  min_hours_between_posts: 4

health:                      # per platform, from the ledger's 24 h views
  window_posts: 5
  baseline_days: 30
  warning_below: 0.60        # share of the account's 30-day median
  pause_below: 0.30
  pause_if_consecutive_under: {posts: 3, views_24h: 1000}
  pause_hours: 48
  raise_tier_a_by_when_paused: 0.5
  new_account_posts_in_warning: 10

money:
  front_load_when_budget_spent_over: 0.70
  drop_campaign_if_usd_per_hour_below: 15     # for two weeks running
  submit_within_min: 30

approval_required: [post, submit, create_account, accept_terms, spend]
never: [buy_engagement, bots, engagement_pods, repost_others, misleading_hooks, unlicensed_clips]
